[tools]
actionlint = "1.7.12"
lychee = "0.24.2"
node = "24.21.0"
rust = { version = "1.97", components = "rustfmt,clippy,rust-analyzer" }
shellcheck = "0.11.0"

[tasks."git:main"]
description = "Fetch origin/main, fast-forward local main unless another worktree holds it, and detach HEAD at origin/main"
shell = "bash -c"
run = """
set -euo pipefail
git fetch origin main
if [ "$(git rev-parse --abbrev-ref HEAD)" = main ]; then
  git checkout -q --detach
fi
notice="Notice: local main was not moved (checked out in another worktree or not a fast-forward)"
if git worktree list --porcelain | grep -qx 'branch refs/heads/main'; then
  echo "$notice" >&2
else
  git fetch origin main:main || echo "$notice" >&2
fi
git checkout --detach origin/main
"""

[tasks.fmt]
description = "Format the whole repository"
shell = "bash -c"
run = """
set -euo pipefail
cargo fmt --all
cargo fmt --manifest-path crates/native/Cargo.toml --all
"""

[tasks.lint]
description = "Run the OS-independent checks"
shell = "bash -c"
run = """
set -euo pipefail
cargo fmt --all -- --check
cargo fmt --manifest-path crates/native/Cargo.toml --all -- --check
shellcheck -x .claude/skills/*/scripts/*.sh tools/git/*.sh tools/stats/*.sh tools/ci/*.sh tools/package/*.sh crates/native/packaging/linux/*.sh
actionlint
lychee --offline --include-fragments --no-progress --exclude-path 'docs.plans.review-history' '*.md' 'docs/**/*.md' '.claude/**/*.md'
bash .claude/skills/merge/scripts/check-merge-approval.test.sh
bash .claude/skills/merge/scripts/wait-post-merge-runs.test.sh
bash .claude/skills/merge-settings/scripts/merge.test.sh
bash tools/ci/local.test.sh
"""

[tasks.test]
description = "Build and test the workspace, per platform"
shell = "bash -c"
run = """
set -euo pipefail
cargo clippy --all-targets -- -D warnings
cargo test
"""

[tasks."native:dev"]
description = "Run the GPUI app (debug build, the GPUI crates optimized as the GPUI Kit guide has it)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo run -- "$@"
"""

[tasks."native:watch"]
description = "Run the GPUI app (debug build) and rebuild and restart it on a source change (a restart, not a hot reload)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" }, watchexec = "2.8.0" }
shell = "bash -c"
run = """
set -euo pipefail
watchexec --restart --shell=none --watch src --watch build.rs --watch Cargo.toml --watch ../core --watch ../backend --exts rs,toml,json -- cargo run -- "$@"
"""

[tasks."native:release"]
description = "Run the GPUI app with an optimized build (use this for any timing measurement)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo run --release -- "$@"
"""

[tasks."native:check"]
description = "Lint and test the GPUI app (a separate workspace, so `lint` and `test` do not cover it)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo clippy --all-targets -- -D warnings
cargo test
"""

[tasks."native:bundle:macos"]
description = "Build Handpic.app from the GPUI app under crates/native/target (macOS; release, or the profile given as its argument, e.g. `debug`)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
usage = 'arg "[profile]" default="release"'
run = """
set -euo pipefail
profile="${usage_profile:-release}"
if [ "$profile" = debug ]; then
  cargo build
else
  cargo build --profile "$profile"
fi
app="target/$profile/Handpic.app"
rm -rf "$app"
mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
cp packaging/macos/Info.plist "$app/Contents/Info.plist"
cp "target/$profile/handpic" "$app/Contents/MacOS/handpic"
cp icons/icon.icns "$app/Contents/Resources/icon.icns"
version="$(bash ../../tools/package/version.sh)"
plutil -replace CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
plutil -replace CFBundleVersion -string "$version" "$app/Contents/Info.plist"
bash ../../tools/package/notices.sh "$app/Contents/Resources/licenses"
echo "$app"
"""

[tasks."native:package:macos"]
description = "Build the release Handpic.app and package it as an ad hoc signed DMG for this Mac's architecture under crates/native/target/release (macOS)"
shell = "bash -c"
run = """
set -euo pipefail
mise run native:bundle:macos
bash tools/package/macos.sh
"""

[tasks."native:package:windows"]
description = "Build the release GPUI app and package it as a per-user Inno Setup setup .exe and a portable ZIP under crates/native/target/release (Windows, Inno Setup 6 installed)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --locked
bash ../../tools/package/windows.sh
"""

[tasks."native:package:linux"]
description = "Build the release GPUI app and package it as a tarball with its install.sh and a .deb under crates/native/target/release (x86_64 Linux, dpkg-dev installed)"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release --locked
bash ../../tools/package/linux.sh
"""

[tasks."native:install:linux"]
description = "Install the GPUI app for the current user (Linux): the release binary to ~/.local/bin, its .desktop file and icon under ~/.local/share"
dir = "crates/native"
tools = { rust = { version = "1.98.1", components = "rustfmt,clippy" } }
shell = "bash -c"
run = """
set -euo pipefail
cargo build --release
install -Dm755 target/release/handpic "$HOME/.local/bin/handpic"
install -Dm644 packaging/linux/dev.minodisk.handpic.desktop "$HOME/.local/share/applications/dev.minodisk.handpic.desktop"
install -Dm644 icons/128x128@2x.png "$HOME/.local/share/icons/hicolor/256x256/apps/dev.minodisk.handpic.png"
"""

[tasks.ci]
description = "Run the same checks CI runs, locally"
shell = "bash -c"
run = """
set -euo pipefail
mise run lint
mise run test
"""

[tasks."ci:local"]
description = "Run only the checks the branch's changed paths call for, on this platform; GitHub Actions runs the rest"
shell = "bash -c"
run = """
set -euo pipefail
bash tools/ci/local.sh
"""
