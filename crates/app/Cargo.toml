[package]
name = "riffle-app"
version = "1.9.0"
edition = "2021"

[features]
# Tauri only enables the webview's devtools automatically in a debug build, so
# an optimized build needs this to opt back in. `mise run tauri:release:devtools` passes
# it; a distributable build leaves it off.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
riffle-core = { path = "../core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
log = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
notify = "8.2.0"
trash = "5.2.9"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
tokio-util = "0.7"
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
percent-encoding = "2.3.1"

[dev-dependencies]
mozjpeg = "0.10"
tower = { version = "0.5", features = ["util"] }
