[package]
name = "handpic-backend"
version = "1.10.0"
edition = "2021"

[dependencies]
handpic-core = { path = "../core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
notify = "8.2.0"
trash = "5.2.9"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
tokio-util = "0.7"
base64 = "0.22"
chrono = "0.4"
axum = "0.8"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
semver = "1"
self_update = { version = "1.3", default-features = false, features = [
  "ureq",
  "rustls",
  "github",
  "archive-tar",
  "compression-tar-gz",
  "archive-zip",
  "compression-zip-deflate",
  "checksums",
  "signatures",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Performance"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
percent-encoding = "2.3.1"

[dev-dependencies]
mozjpeg = "0.10"
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
zipsign-api = { version = "0.2.2", default-features = false, features = ["sign-tar", "sign-zip"] }
zip = { version = "9", default-features = false }
tar = "0.4"
flate2 = "1"
