[package]
name = "handpic-native"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "handpic"
path = "src/main.rs"

[workspace]

[dependencies]
gpui-kit = "=0.9.1"
# Only for the `screenshot` feature: its `test-support` turns on GPUI's
# `Window::render_to_image` (gpui-kit's own would pull gpui-fast into the lock).
gpui-pre-platform = { version = "=0.3.12", optional = true, features = ["test-support"] }
handpic-core = { path = "../core" }
handpic-backend = { path = "../backend" }
mozjpeg = "0.10"
natord = "1"
dirs = "6"
futures = "0.3"
log = "0.4"
image = { version = "0.25", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[features]
screenshot = ["dep:gpui-pre-platform", "image/png"]

[dev-dependencies]
# GPUI's `TestAppContext` for the UI tests, through the same crate the
# `screenshot` feature turns `test-support` on in (see there).
gpui-pre-platform = { version = "=0.3.12", features = ["test-support"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
# The `screenshot` feature's resize and PNG encode, near the bridge's 5 s
# wait unoptimized for a 4096 px capture.
image = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
crc32fast = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
