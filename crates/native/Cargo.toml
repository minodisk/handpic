[package]
name = "riffle-native"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "riffle-native"
path = "src/main.rs"

[workspace]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "=0.9.1"
riffle-core = { path = "../core" }
riffle-backend = { path = "../backend" }
mozjpeg = "0.10"
natord = "1"
dirs = "6"
futures = "0.3"
log = "0.4"
image = { version = "0.25", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
