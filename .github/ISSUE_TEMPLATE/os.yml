name: OS problem
description: Handpic does not install, launch or behave correctly on your OS.
title: "[OS] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If Handpic works fine on your OS, please post in the OS works report thread in Discussions instead.
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.5 (Apple silicon) / Windows 11 24H2 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: handpic-version
    attributes:
      label: Handpic version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Handpic.log
      description: |
        Paste the contents of `Handpic.log` or attach the file. `Help > Open Log Folder` opens the folder, or find it at:
        - Windows: `%LOCALAPPDATA%\dev.minodisk.handpic\logs\`
        - macOS: `~/Library/Logs/dev.minodisk.handpic/`
        - Linux: `~/.local/share/dev.minodisk.handpic/logs/`
      render: text
