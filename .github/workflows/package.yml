name: Package

# Builds the native app's (crates/native) distributables and uploads them as
# this run's artifacts. Manual only, and it touches no release: attaching them
# to one is release.yml's business. A dispatch runs the workflow file of the
# chosen ref, so `gh workflow run package.yml --ref <branch>` packages a branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The two macOS runners differ in architecture, so each builds its own DMG:
  # macos-latest is arm64, macos-15-intel x86_64.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # A cold release build of the GPUI app takes longer than CI's debug one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      # The crate's build.rs refuses to build without NASM on x86_64, because
      # mozjpeg would otherwise lose SIMD silently.
      - uses: ilammy/setup-nasm@v1

      # Keyed by the runner, not runner.os: the two macOS runners would
      # otherwise share a target folder of the other architecture.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/native/target
          key: cargo-native-release-${{ matrix.os }}-${{ hashFiles('crates/native/Cargo.lock') }}
          restore-keys: cargo-native-release-${{ matrix.os }}-

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      # Through `mise exec`, as ci.yml's `native` job builds, so every
      # platform's leg has the one command path.
      - name: Build the release binary
        shell: bash
        working-directory: crates/native
        run: mise exec rust@1.98.1 -- cargo build --release --locked

      # The bundle task's own cargo build finds the binary above up to date.
      - name: Lay out Handpic.app
        shell: bash
        run: mise run native:bundle:macos

      - name: Package the DMG
        shell: bash
        run: bash tools/package/macos.sh

      - name: Check the DMG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="crates/native/target/release/Handpic-$VERSION-macos-$ARCH.dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/Handpic.app"
          codesign --verify --strict --verbose=2 "$app"
          test -x "$app/Contents/MacOS/handpic"
          lipo -archs "$app/Contents/MacOS/handpic" | grep -qx "$ARCH"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist")" = "$VERSION"
          ls "$app/Contents/Resources/licenses"
          test -s "$app/Contents/Resources/licenses/NOTICE-gpui"
          test -L "$mount/Applications"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          path: crates/native/target/release/Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - uses: ilammy/setup-nasm@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/native/target
          key: cargo-native-release-windows-latest-${{ hashFiles('crates/native/Cargo.lock') }}
          restore-keys: cargo-native-release-windows-latest-

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      # As ci.yml's `native` job: setup-nasm's folder is put on PATH by hand
      # for the build script behind `mise exec`.
      - name: Build the release binary
        shell: bash
        working-directory: crates/native
        run: |
          nasm_dir="$(cygpath -u "$USERPROFILE")/nasm"
          export PATH="$PATH:$nasm_dir"
          mise exec rust@1.98.1 -- nasm -v
          mise exec rust@1.98.1 -- cargo build --release --locked

      # The runner image ships Inno Setup 6; windows.sh finds its ISCC.exe.
      - name: Package the setup and the ZIP
        shell: bash
        run: bash tools/package/windows.sh

      # The runner is elevated, so this proves the per-user location, the HKCU
      # entry and the silent runs, not the absence of a UAC prompt.
      - name: Check the setup and the ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'crates/native/target/release'
          $setup = Resolve-Path "$release/Handpic-$env:VERSION-windows-x64-setup.exe"
          $zip = Resolve-Path "$release/Handpic-$env:VERSION-windows-x64.zip"
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          function Invoke-Silent($exe, $what) {
            $p = Start-Process -FilePath $exe -ArgumentList $silent -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$what exited with $($p.ExitCode)" }
          }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Handpic'
          $exe = Join-Path $app 'handpic.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1'
          $machineKeys = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Handpic.lnk'
          function Assert-Installed {
            if (-not (Test-Path $exe)) { throw "no $exe" }
            if (-not (Test-Path (Join-Path $app 'licenses\NOTICE-gpui'))) { throw 'no licenses' }
            $entry = Get-ItemProperty $key
            $entry | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
            if ($entry.DisplayVersion -ne $env:VERSION) { throw "DisplayVersion $($entry.DisplayVersion)" }
            foreach ($k in $machineKeys) { if (Test-Path $k) { throw "machine-wide entry $k" } }
            if (-not (Test-Path $shortcut)) { throw "no $shortcut" }
          }
          Invoke-Silent $setup 'the install'
          Assert-Installed
          Invoke-Silent $setup 'the upgrade'
          Assert-Installed
          Get-ChildItem $app
          Invoke-Silent (Join-Path $app 'unins000.exe') 'the uninstall'
          # The uninstaller hands over to a copy of itself in %TEMP%.
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "$exe left after the uninstall" }
          if (Test-Path $key) { throw "$key left after the uninstall" }
          if (Test-Path $shortcut) { throw "$shortcut left after the uninstall" }
          $out = Join-Path $env:RUNNER_TEMP 'zip'
          Expand-Archive -Path $zip -DestinationPath $out
          Get-ChildItem -Recurse $out | Select-Object -ExpandProperty FullName
          if (-not (Test-Path (Join-Path $out 'Handpic\handpic.exe'))) { throw 'no exe in the ZIP' }
          if (-not (Test-Path (Join-Path $out 'Handpic\licenses\NOTICE-gpui'))) { throw 'no licenses in the ZIP' }

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          path: crates/native/target/release/Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-windows-x64.zip
          path: crates/native/target/release/Handpic-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The same list as ci.yml's `native` job (native-app.md keeps the two
      # equal). dpkg-dev, for dpkg-shlibdeps, is on the runner image.
      - name: Install the Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libvulkan1

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - uses: ilammy/setup-nasm@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/native/target
          key: cargo-native-release-ubuntu-latest-${{ hashFiles('crates/native/Cargo.lock') }}
          restore-keys: cargo-native-release-ubuntu-latest-

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build the release binary
        shell: bash
        working-directory: crates/native
        run: mise exec rust@1.98.1 -- cargo build --release --locked

      - name: Package the tarball, install.sh and the .deb
        shell: bash
        run: bash tools/package/linux.sh

      # What the binary links and what it opens at run time, and the image's
      # glibc, which the deb's Depends follows.
      - name: Show the binary's libraries
        shell: bash
        run: |
          binary=crates/native/target/release/handpic
          objdump -p "$binary" | grep -E 'NEEDED|GLIBC_' || true
          objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          grep -aoE 'lib[A-Za-z0-9_+-]+\.so(\.[0-9]+)*' "$binary" | sort -u
          ldd --version | head -n 1
          grep PRETTY_NAME /etc/os-release

      # The runner has no display and no Vulkan driver, so nothing is launched.
      - name: Check the tarball and install.sh
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release="$PWD/crates/native/target/release"
          tarball="$release/Handpic-$VERSION-linux-x64.tar.gz"
          tar -tzvf "$tarball"
          digest="$(sha256sum "$tarball" | cut -d' ' -f1)"
          home="$(mktemp -d)"
          HOME="$home" sh "$release/install.sh" "$tarball" "$digest"
          test -x "$home/.local/bin/handpic"
          desktop="$home/.local/share/applications/dev.minodisk.handpic.desktop"
          cat "$desktop"
          grep -qx "Exec=\"$home/.local/bin/handpic\"" "$desktop"
          grep -qx 'Icon=dev.minodisk.handpic' "$desktop"
          grep -qx 'StartupWMClass=dev.minodisk.handpic' "$desktop"
          test -s "$home/.local/share/icons/hicolor/256x256/apps/dev.minodisk.handpic.png"
          wrong="$(mktemp -d)"
          if HOME="$wrong" sh "$release/install.sh" "$tarball" "$(printf '%064d' 0)"; then
            echo "a wrong digest installed" >&2
            exit 1
          fi
          test ! -e "$wrong/.local"

      - name: Check the .deb
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deb="$PWD/crates/native/target/release/handpic_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          depends="$(dpkg-deb --field "$deb" Depends)"
          for package in libc6 libvulkan1 libwayland-client0; do
            grep -qE "(^|, )$package( |,|$)" <<<"$depends"
          done
          sudo apt-get install -y "$deb"
          dpkg -s handpic
          test -x /usr/lib/handpic/handpic
          grep -qx 'Exec=/usr/lib/handpic/handpic' /usr/share/applications/dev.minodisk.handpic.desktop
          test -s /usr/share/icons/hicolor/256x256/apps/dev.minodisk.handpic.png
          test -s /usr/share/doc/handpic/NOTICE-gpui
          sudo apt-get remove -y handpic
          test ! -e /usr/lib/handpic/handpic
          test ! -e /usr/share/applications/dev.minodisk.handpic.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          path: crates/native/target/release/Handpic-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: crates/native/target/release/install.sh
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: handpic_${{ steps.version.outputs.version }}_amd64.deb
          path: crates/native/target/release/handpic_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  # One SHA256SUMS over every artifact the run built.
  checksums:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute the checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
