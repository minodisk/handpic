name: Package

# Builds the app's (crates/app) distributables and uploads them as
# this run's artifacts. Manual only, and it touches no release: attaching them
# to one is release.yml's business. A dispatch runs the workflow file of the
# chosen ref, so `gh workflow run package.yml --ref <branch>` packages a branch.
# `-f version=<x.y.z[-prerelease]>` packages that version instead of
# crates/app/Cargo.toml's, which set-version.sh writes before the build.
# `-f update_test_repo=<owner/name>` makes a test build: the build gets
# HANDPIC_UPDATE_TEST_REPO and the updater's four archives are signed with the
# checked-in test key (crates/app/packaging/test/). Without it nothing is
# signed; release.yml signs with the production key.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to package (x.y.z or x.y.z-<prerelease>); empty keeps crates/app/Cargo.toml's
        required: false
        default: ""
        type: string
      update_test_repo:
        description: A scratch repository (owner/name) a test build updates from; signs the updater's archives with the test key. Never distribute such a build
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  # The two macOS runners differ in architecture, so each builds its own DMG:
  # macos-latest is arm64, macos-15-intel x86_64.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # A cold release build of the GPUI app takes longer than CI's debug one.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      # The crate's build.rs refuses to build without NASM on x86_64, because
      # mozjpeg would otherwise lose SIMD silently.
      - uses: ilammy/setup-nasm@v1

      # Keyed by the runner, not runner.os: the two macOS runners would
      # otherwise share a target folder of the other architecture.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/app/target
          key: cargo-app-release-${{ matrix.os }}-${{ hashFiles('crates/app/Cargo.lock') }}
          restore-keys: cargo-app-release-${{ matrix.os }}-

      # After the cache step, so its key is Cargo.lock as checked in.
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash tools/package/set-version.sh "$VERSION"

      - name: Read the version
        id: version
        shell: bash
        run: |
          for form in numeric windows deb; do
            echo "$form=$(bash tools/package/version.sh "$form")" >> "$GITHUB_OUTPUT"
          done
          echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      # Read by the updater at build time; left unset for any other build.
      - name: Make a test build
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          REPO: ${{ inputs.update_test_repo }}
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "update_test_repo: $REPO is not owner/name" >&2
            exit 1
          fi
          echo "HANDPIC_UPDATE_TEST_REPO=$REPO" >> "$GITHUB_ENV"

      # Through `mise exec`, as ci.yml's `app` job builds, so every
      # platform's leg has the one command path.
      - name: Build the release binary
        shell: bash
        working-directory: crates/app
        run: mise exec rust@1.98.1 -- cargo build --release --locked

      # The bundle task's own cargo build finds the binary above up to date.
      - name: Lay out Handpic.app
        shell: bash
        run: mise run app:bundle:macos

      - name: Package the DMG and the tarball
        shell: bash
        run: bash tools/package/macos.sh

      - name: Sign the tarball with the test key
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mise run app:sign -- crates/app/packaging/test/update.key crates/app/packaging/test/update.pub \
            "crates/app/target/release/Handpic-$VERSION-macos-$ARCH.tar.gz"

      - name: Check the DMG
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NUMERIC: ${{ steps.version.outputs.numeric }}
          ARCH: ${{ matrix.arch }}
        run: |
          dmg="crates/app/target/release/Handpic-$VERSION-macos-$ARCH.dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/Handpic.app"
          codesign --verify --strict --verbose=2 "$app"
          test -x "$app/Contents/MacOS/handpic"
          lipo -archs "$app/Contents/MacOS/handpic" | grep -qx "$ARCH"
          # Both fields take the numeric form, a prerelease's suffix dropped.
          for field in CFBundleShortVersionString CFBundleVersion; do
            value="$(plutil -extract "$field" raw "$app/Contents/Info.plist")"
            echo "$field $value"
            [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$value" = "$NUMERIC"
          done
          ls "$app/Contents/Resources/licenses"
          test -s "$app/Contents/Resources/licenses/NOTICE-gpui"
          test -L "$mount/Applications"
          hdiutil detach "$mount"

      # The updater installs the Handpic.app of this tarball whole, so the
      # extracted bundle must keep its ad hoc signature.
      - name: Check the tarball
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          tarball="crates/app/target/release/Handpic-$VERSION-macos-$ARCH.tar.gz"
          tar -tzf "$tarball" > "$RUNNER_TEMP/entries"
          if grep -vE '^Handpic\.app(/|$)' "$RUNNER_TEMP/entries"; then
            echo "an entry outside Handpic.app" >&2
            exit 1
          fi
          if grep -E '(^|/)\._' "$RUNNER_TEMP/entries"; then
            echo "an AppleDouble entry" >&2
            exit 1
          fi
          out="$(mktemp -d)"
          tar -xzf "$tarball" -C "$out"
          codesign --verify --strict --verbose=2 "$out/Handpic.app"
          lipo -archs "$out/Handpic.app/Contents/MacOS/handpic" | grep -qx "$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.tar.gz
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - uses: ilammy/setup-nasm@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/app/target
          key: cargo-app-release-windows-latest-${{ hashFiles('crates/app/Cargo.lock') }}
          restore-keys: cargo-app-release-windows-latest-

      # After the cache step, so its key is Cargo.lock as checked in.
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash tools/package/set-version.sh "$VERSION"

      - name: Read the version
        id: version
        shell: bash
        run: |
          for form in numeric windows deb; do
            echo "$form=$(bash tools/package/version.sh "$form")" >> "$GITHUB_OUTPUT"
          done
          echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      # Read by the updater at build time; left unset for any other build.
      - name: Make a test build
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          REPO: ${{ inputs.update_test_repo }}
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "update_test_repo: $REPO is not owner/name" >&2
            exit 1
          fi
          echo "HANDPIC_UPDATE_TEST_REPO=$REPO" >> "$GITHUB_ENV"

      # As ci.yml's `app` job: setup-nasm's folder is put on PATH by hand
      # for the build script behind `mise exec`.
      - name: Build the release binary
        shell: bash
        working-directory: crates/app
        run: |
          nasm_dir="$(cygpath -u "$USERPROFILE")/nasm"
          export PATH="$PATH:$nasm_dir"
          mise exec rust@1.98.1 -- nasm -v
          mise exec rust@1.98.1 -- cargo build --release --locked

      # The runner image ships Inno Setup 6; windows.sh finds its ISCC.exe.
      - name: Package the setup and the ZIPs
        shell: bash
        run: bash tools/package/windows.sh

      - name: Sign the ZIPs with the test key
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release=crates/app/target/release
          mise run app:sign -- crates/app/packaging/test/update.key crates/app/packaging/test/update.pub \
            "$release/Handpic-$VERSION-windows-x64.zip" "$release/Handpic-$VERSION-windows-x64-setup.exe.zip"

      # The runner is elevated, so this proves the per-user location, the HKCU
      # entry and the silent runs, not the absence of a UAC prompt.
      - name: Check the setup and the ZIPs
        shell: pwsh
        timeout-minutes: 15
        env:
          VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_VERSION: ${{ steps.version.outputs.windows }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'crates/app/target/release'
          $setup = Resolve-Path "$release/Handpic-$env:VERSION-windows-x64-setup.exe"
          $zip = Resolve-Path "$release/Handpic-$env:VERSION-windows-x64.zip"
          # The setup's file version is the Windows form, Inno's VersionInfoVersion.
          $info = (Get-Item $setup).VersionInfo
          $fileVersion = "$($info.FileMajorPart).$($info.FileMinorPart).$($info.FileBuildPart).$($info.FilePrivatePart)"
          Write-Output "setup file version $fileVersion"
          if ($fileVersion -ne $env:WINDOWS_VERSION) { throw "setup file version $fileVersion" }
          $silent = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # Not -Wait: it waits for every descendant too, so a setup that
          # relaunches the app would never return while the app runs.
          function Invoke-Silent($exe, $what, $more = @()) {
            $p = Start-Process -FilePath $exe -ArgumentList ($silent + $more) -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { throw "$what did not finish in 300 s" }
            if ($p.ExitCode -ne 0) { throw "$what exited with $($p.ExitCode)" }
          }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Handpic'
          $exe = Join-Path $app 'handpic.exe'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1'
          $machineKeys = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\dev.minodisk.handpic_is1'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Handpic.lnk'
          function Assert-Installed {
            if (-not (Test-Path $exe)) { throw "no $exe" }
            if (-not (Test-Path (Join-Path $app 'licenses\NOTICE-gpui'))) { throw 'no licenses' }
            $entry = Get-ItemProperty $key
            $entry | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
            if ($entry.DisplayVersion -ne $env:VERSION) { throw "DisplayVersion $($entry.DisplayVersion)" }
            # winresource writes CARGO_PKG_VERSION as the exe's ProductVersion.
            $product = (Get-Item $exe).VersionInfo.ProductVersion
            if ($product -ne $env:VERSION) { throw "the exe's ProductVersion $product" }
            foreach ($k in $machineKeys) { if (Test-Path $k) { throw "machine-wide entry $k" } }
            if (-not (Test-Path $shortcut)) { throw "no $shortcut" }
          }
          # A launch of the installed app: its process, or its log written since.
          $log = Join-Path $env:LOCALAPPDATA 'dev.minodisk.handpic\logs\Handpic.log'
          function Get-Apps {
            @(Get-CimInstance Win32_Process -Filter "Name = 'handpic.exe'" | Where-Object { $_.ExecutablePath -eq $exe })
          }
          function Test-Launched($since) {
            ((Get-Apps).Count -gt 0) -or ((Test-Path $log) -and (Get-Item $log).LastWriteTime -ge $since)
          }
          Invoke-Silent $setup 'the install'
          Assert-Installed
          # The upgrade the updater runs at quit (/WAITPID, no /RELAUNCH). A
          # stand-in for the quitting app holds the exe open for reading only, as
          # a running image is; the setup waits for its pid. The holder ending
          # its whole hold with 0 (not closed by the Restart Manager) and the
          # setup not finishing before it show the wait.
          $hold = 8
          $holder = Start-Process -FilePath pwsh -PassThru -ArgumentList '-NoProfile', '-Command',
            "`$f = [IO.File]::Open('$exe', 'Open', 'Read', 'Read'); Start-Sleep -Seconds $hold; `$f.Close()"
          $null = $holder.Handle
          Start-Sleep -Seconds 2
          $started = Get-Date
          Invoke-Silent $setup 'the upgrade at quit' @("/WAITPID=$($holder.Id)")
          $elapsed = ((Get-Date) - $started).TotalSeconds
          if (-not $holder.WaitForExit(60000)) { throw 'the holder did not exit in 60 s' }
          Write-Output "the upgrade at quit took $elapsed s; the holder exited with $($holder.ExitCode)"
          if ($holder.ExitCode -ne 0) { throw "the holder exited with $($holder.ExitCode)" }
          if ($elapsed -lt $hold - 3) { throw "the setup did not wait for the holder ($elapsed s)" }
          Assert-Installed
          Start-Sleep -Seconds 10
          if (Test-Launched $started) { throw 'the setup without /RELAUNCH started the app' }
          # Restart Now's run: /RELAUNCH starts the installed app at the end.
          $started = Get-Date
          Invoke-Silent $setup 'the upgrade with the relaunch' @('/RELAUNCH')
          Assert-Installed
          $launched = $false
          for ($i = 0; $i -lt 30 -and -not $launched; $i++) {
            Start-Sleep -Seconds 1
            $launched = Test-Launched $started
          }
          Get-Apps | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not $launched) { throw 'the setup with /RELAUNCH did not start the app' }
          Start-Sleep -Seconds 2
          Get-ChildItem $app
          Invoke-Silent (Join-Path $app 'unins000.exe') 'the uninstall'
          # The uninstaller hands over to a copy of itself in %TEMP%.
          for ($i = 0; $i -lt 60 -and ((Test-Path $exe) -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "$exe left after the uninstall" }
          if (Test-Path $key) { throw "$key left after the uninstall" }
          if (Test-Path $shortcut) { throw "$shortcut left after the uninstall" }
          $out = Join-Path $env:RUNNER_TEMP 'zip'
          Expand-Archive -Path $zip -DestinationPath $out
          Get-ChildItem -Recurse $out | Select-Object -ExpandProperty FullName
          if (-not (Test-Path (Join-Path $out 'Handpic\handpic.exe'))) { throw 'no exe in the ZIP' }
          if (-not (Test-Path (Join-Path $out 'Handpic\licenses\NOTICE-gpui'))) { throw 'no licenses in the ZIP' }
          # The setup ZIP holds the setup alone, byte for byte.
          $setupZip = Resolve-Path "$release/Handpic-$env:VERSION-windows-x64-setup.exe.zip"
          $setupOut = Join-Path $env:RUNNER_TEMP 'setup-zip'
          Expand-Archive -Path $setupZip -DestinationPath $setupOut
          $entries = @(Get-ChildItem -Recurse $setupOut)
          $entries | Select-Object -ExpandProperty FullName
          if ($entries.Count -ne 1) { throw "the setup ZIP holds $($entries.Count) entries" }
          $extracted = Join-Path $setupOut "Handpic-$env:VERSION-windows-x64-setup.exe"
          if ((Get-FileHash $extracted).Hash -ne (Get-FileHash $setup).Hash) { throw 'the setup ZIP holds another setup' }

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-windows-x64.zip
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe.zip
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-windows-x64-setup.exe.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The same list as ci.yml's `app` job (app.md keeps the two
      # equal). dpkg-dev, for dpkg-shlibdeps, is on the runner image.
      - name: Install the Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libvulkan1

      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.0

      - uses: ilammy/setup-nasm@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/app/target
          key: cargo-app-release-ubuntu-latest-${{ hashFiles('crates/app/Cargo.lock') }}
          restore-keys: cargo-app-release-ubuntu-latest-

      # After the cache step, so its key is Cargo.lock as checked in.
      - name: Set the version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: bash tools/package/set-version.sh "$VERSION"

      - name: Read the version
        id: version
        shell: bash
        run: |
          for form in numeric windows deb; do
            echo "$form=$(bash tools/package/version.sh "$form")" >> "$GITHUB_OUTPUT"
          done
          echo "version=$(bash tools/package/version.sh)" >> "$GITHUB_OUTPUT"

      # Read by the updater at build time; left unset for any other build.
      - name: Make a test build
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          REPO: ${{ inputs.update_test_repo }}
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "update_test_repo: $REPO is not owner/name" >&2
            exit 1
          fi
          echo "HANDPIC_UPDATE_TEST_REPO=$REPO" >> "$GITHUB_ENV"

      - name: Build the release binary
        shell: bash
        working-directory: crates/app
        run: mise exec rust@1.98.1 -- cargo build --release --locked

      - name: Package the tarball, install.sh and the .deb
        shell: bash
        run: bash tools/package/linux.sh

      - name: Sign the tarball with the test key
        if: inputs.update_test_repo != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mise run app:sign -- crates/app/packaging/test/update.key crates/app/packaging/test/update.pub \
            "crates/app/target/release/Handpic-$VERSION-linux-x64.tar.gz"

      # What the binary links and what it opens at run time, and the image's
      # glibc, which the deb's Depends follows.
      - name: Show the binary's libraries
        shell: bash
        run: |
          binary=crates/app/target/release/handpic
          objdump -p "$binary" | grep -E 'NEEDED|GLIBC_' || true
          objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          grep -aoE 'lib[A-Za-z0-9_+-]+\.so(\.[0-9]+)*' "$binary" | sort -u
          ldd --version | head -n 1
          grep PRETTY_NAME /etc/os-release

      # The runner has no display and no Vulkan driver, so nothing is launched.
      - name: Check the tarball and install.sh
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release="$PWD/crates/app/target/release"
          tarball="$release/Handpic-$VERSION-linux-x64.tar.gz"
          tar -tzvf "$tarball"
          digest="$(sha256sum "$tarball" | cut -d' ' -f1)"
          home="$(mktemp -d)"
          HOME="$home" sh "$release/install.sh" "$tarball" "$digest"
          test -x "$home/.local/bin/handpic"
          desktop="$home/.local/share/applications/dev.minodisk.handpic.desktop"
          cat "$desktop"
          grep -qx "Exec=\"$home/.local/bin/handpic\"" "$desktop"
          grep -qx 'Icon=dev.minodisk.handpic' "$desktop"
          grep -qx 'StartupWMClass=dev.minodisk.handpic' "$desktop"
          test -s "$home/.local/share/icons/hicolor/256x256/apps/dev.minodisk.handpic.png"
          wrong="$(mktemp -d)"
          if HOME="$wrong" sh "$release/install.sh" "$tarball" "$(printf '%064d' 0)"; then
            echo "a wrong digest installed" >&2
            exit 1
          fi
          test ! -e "$wrong/.local"

      - name: Check the .deb
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEB_VERSION: ${{ steps.version.outputs.deb }}
        run: |
          deb="$PWD/crates/app/target/release/handpic_${VERSION}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$DEB_VERSION"
          # A prerelease sorts before its release, rc.2 before rc.10.
          rc2="$(bash tools/package/version.sh deb 2.0.0-rc.2)"
          rc10="$(bash tools/package/version.sh deb 2.0.0-rc.10)"
          stable="$(bash tools/package/version.sh deb 2.0.0)"
          test "$rc2" = 2.0.0~rc.2
          dpkg --compare-versions "$rc2" lt "$rc10"
          dpkg --compare-versions "$rc10" lt "$stable"
          depends="$(dpkg-deb --field "$deb" Depends)"
          for package in libc6 libvulkan1 libwayland-client0; do
            grep -qE "(^|, )$package( |,|$)" <<<"$depends"
          done
          sudo apt-get install -y "$deb"
          dpkg -s handpic
          test -x /usr/lib/handpic/handpic
          grep -qx 'Exec=/usr/lib/handpic/handpic' /usr/share/applications/dev.minodisk.handpic.desktop
          test -s /usr/share/icons/hicolor/256x256/apps/dev.minodisk.handpic.png
          test -s /usr/share/doc/handpic/NOTICE-gpui
          sudo apt-get remove -y handpic
          test ! -e /usr/lib/handpic/handpic
          test ! -e /usr/share/applications/dev.minodisk.handpic.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: Handpic-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          path: crates/app/target/release/Handpic-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: install.sh
          path: crates/app/target/release/install.sh
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: handpic_${{ steps.version.outputs.version }}_amd64.deb
          path: crates/app/target/release/handpic_${{ steps.version.outputs.version }}_amd64.deb
          if-no-files-found: error

  # One SHA256SUMS over every artifact the run built, the signed archives as
  # signed.
  checksums:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute the checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # The digest a person copies from SHA256SUMS installs the tarball.
      - name: Check install.sh against SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          tarballs=(Handpic-*-linux-x64.tar.gz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          digest="$(awk -v name="$tarball" '$2 == name { print $1 }' SHA256SUMS)"
          test -n "$digest"
          home="$(mktemp -d)"
          HOME="$home" sh install.sh "$tarball" "$digest"
          test -x "$home/.local/bin/handpic"

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
