name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the release PR, and creates the tag and a draft GitHub
  # release when that PR is merged. The PAT makes the release PR trigger ci.yml, which
  # GITHUB_TOKEN-authored PRs do not.
  #
  # No job builds or publishes anything: the Tauri build left with the Tauri
  # app, and releases are suspended until the native release flow lands, so a
  # merged release PR leaves a draft release with no assets.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
